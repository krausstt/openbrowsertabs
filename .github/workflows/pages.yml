name: Deploy demo to GitHub Pages

on:
  push:
    branches: ['claude/browser-tabs-data-science-fqre87', 'main']
    paths: ['web/**', '.github/workflows/pages.yml', 'pipeline/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # the demo corpus is generated by the real pipeline, so a stale
      # data.json can never drift away from the committed rules
      - name: Regenerate demo dataset
        run: python3 web/build_demo_data.py > web/data.json

      - name: Verify dataset
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('web/data.json'))
          assert len(d['nodes']) > 50, 'too few demo nodes'
          assert {'supersedes','discusses_same_standard','same_organization','similar_to'} \
              <= {e['type'] for e in d['edges']}, 'missing edge types'
          print(f"ok: {len(d['nodes'])} nodes, {len(d['edges'])} edges")
          PY

      # One-time manual step before this can succeed:
      #   Settings → Pages → Build and deployment → Source: "GitHub Actions"
      # (the workflow token is not allowed to create the Pages site itself)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
